<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <style>
      @keyframes pulse1 { 0%,100%{r:3;opacity:.4} 50%{r:5;opacity:1} }
      @keyframes pulse2 { 0%,100%{r:2.5;opacity:.3} 50%{r:4.5;opacity:.9} }
      @keyframes pulse3 { 0%,100%{r:2;opacity:.5} 50%{r:4;opacity:1} }
      @keyframes drift1 { 0%{transform:translate(0,0)} 25%{transform:translate(3px,-2px)} 50%{transform:translate(-1px,3px)} 75%{transform:translate(-3px,-1px)} 100%{transform:translate(0,0)} }
      @keyframes drift2 { 0%{transform:translate(0,0)} 25%{transform:translate(-2px,3px)} 50%{transform:translate(2px,-2px)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0,0)} }
      @keyframes drift3 { 0%{transform:translate(0,0)} 33%{transform:translate(4px,1px)} 66%{transform:translate(-2px,-3px)} 100%{transform:translate(0,0)} }
      @keyframes flowLine { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }
      @keyframes glowPulse { 0%,100%{opacity:.15} 50%{opacity:.4} }
      @keyframes particleFloat1 { 0%{transform:translate(0,0);opacity:0} 10%{opacity:.7} 90%{opacity:.7} 100%{transform:translate(80px,-30px);opacity:0} }
      @keyframes particleFloat2 { 0%{transform:translate(0,0);opacity:0} 10%{opacity:.5} 90%{opacity:.5} 100%{transform:translate(-60px,25px);opacity:0} }
      @keyframes particleFloat3 { 0%{transform:translate(0,0);opacity:0} 15%{opacity:.6} 85%{opacity:.6} 100%{transform:translate(50px,40px);opacity:0} }
      @keyframes particleFloat4 { 0%{transform:translate(0,0);opacity:0} 10%{opacity:.4} 90%{opacity:.4} 100%{transform:translate(-70px,-20px);opacity:0} }
      @keyframes neuronFire { 0%{stroke:#1f6feb33;filter:none} 15%{stroke:#58a6ff;filter:drop-shadow(0 0 3px #58a6ff)} 30%{stroke:#1f6feb33;filter:none} 100%{stroke:#1f6feb33;filter:none} }
      @keyframes textGlow { 0%,100%{filter:drop-shadow(0 0 2px #58a6ff00)} 50%{filter:drop-shadow(0 0 8px #58a6ff66)} }
      @keyframes ringExpand { 0%{r:6;opacity:.6;stroke-width:1.5} 100%{r:18;opacity:0;stroke-width:.3} }
      .node{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
      .n1{animation:pulse1 3s infinite,drift1 8s infinite}
      .n2{animation:pulse2 2.5s infinite .5s,drift2 10s infinite}
      .n3{animation:pulse3 3.5s infinite 1s,drift3 7s infinite}
      .n4{animation:pulse1 2.8s infinite 1.5s,drift2 9s infinite}
      .n5{animation:pulse2 3.2s infinite .3s,drift1 11s infinite}
      .n6{animation:pulse3 2.7s infinite .8s,drift3 8s infinite}
      .conn{stroke-dasharray:4 3;animation:flowLine 2s linear infinite;opacity:.25}
      .conn-fire1{animation:neuronFire 4s ease infinite}
      .conn-fire2{animation:neuronFire 4s ease infinite 1.5s}
      .conn-fire3{animation:neuronFire 4s ease infinite 3s}
      .glow-ring{animation:ringExpand 3s ease-out infinite;fill:none;stroke:#58a6ff}
      .gr2{animation-delay:1s}
      .gr3{animation-delay:2s}
      .particle{animation-timing-function:linear;animation-iteration-count:infinite;fill:#58a6ff}
      .p1{animation:particleFloat1 6s infinite}
      .p2{animation:particleFloat2 7s infinite .8s}
      .p3{animation:particleFloat3 5s infinite 1.5s}
      .p4{animation:particleFloat4 8s infinite 2s}
      .p5{animation:particleFloat1 5.5s infinite 3s}
      .p6{animation:particleFloat2 6.5s infinite 4s}
      .p7{animation:particleFloat3 7.5s infinite 1s}
      .p8{animation:particleFloat4 5s infinite 2.5s}
      .glow-bg{animation:glowPulse 5s ease-in-out infinite}
      .title-glow{animation:textGlow 4s ease-in-out infinite}
    </style>
    <radialGradient id="bg-glow1" cx="30%" cy="40%"><stop offset="0%" stop-color="#1f6feb" stop-opacity=".12"/><stop offset="100%" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg-glow2" cx="70%" cy="60%"><stop offset="0%" stop-color="#8957e5" stop-opacity=".08"/><stop offset="100%" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <radialGradient id="node-glow"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".8"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1f6feb" stop-opacity=".1"/><stop offset="50%" stop-color="#58a6ff" stop-opacity=".5"/><stop offset="100%" stop-color="#1f6feb" stop-opacity=".1"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#0d1117"/>
  <rect width="900" height="200" fill="url(#bg-glow1)" class="glow-bg"/>
  <rect width="900" height="200" fill="url(#bg-glow2)" class="glow-bg" style="animation-delay:2.5s"/>

  <!-- Neural Network Connections -->
  <g stroke="#1f6feb" stroke-width=".6" fill="none">
    <line x1="80" y1="60" x2="200" y2="90" class="conn conn-fire1"/>
    <line x1="200" y1="90" x2="330" y2="50" class="conn conn-fire1"/>
    <line x1="200" y1="90" x2="310" y2="140" class="conn conn-fire2"/>
    <line x1="330" y1="50" x2="450" y2="100" class="conn conn-fire2"/>
    <line x1="310" y1="140" x2="450" y2="100" class="conn conn-fire3"/>
    <line x1="450" y1="100" x2="580" y2="60" class="conn conn-fire1"/>
    <line x1="450" y1="100" x2="600" y2="150" class="conn conn-fire2"/>
    <line x1="580" y1="60" x2="700" y2="80" class="conn conn-fire3"/>
    <line x1="600" y1="150" x2="700" y2="80" class="conn conn-fire1"/>
    <line x1="700" y1="80" x2="820" y2="55" class="conn conn-fire2"/>
    <line x1="700" y1="80" x2="830" y2="130" class="conn conn-fire3"/>
    <line x1="80" y1="60" x2="120" y2="150" class="conn conn-fire3"/>
    <line x1="120" y1="150" x2="310" y2="140" class="conn conn-fire1"/>
    <line x1="820" y1="55" x2="830" y2="130" class="conn conn-fire2"/>
    <!-- Cross connections layer 2 -->
    <line x1="80" y1="60" x2="330" y2="50" class="conn" style="opacity:.1"/>
    <line x1="330" y1="50" x2="580" y2="60" class="conn" style="opacity:.1"/>
    <line x1="580" y1="60" x2="820" y2="55" class="conn" style="opacity:.1"/>
    <line x1="120" y1="150" x2="600" y2="150" class="conn" style="opacity:.08"/>
  </g>

  <!-- Expanding Rings (neural firing) -->
  <circle cx="200" cy="90" class="glow-ring" r="6"/>
  <circle cx="200" cy="90" class="glow-ring gr2" r="6"/>
  <circle cx="450" cy="100" class="glow-ring gr3" r="6"/>
  <circle cx="700" cy="80" class="glow-ring" r="6" style="animation-delay:1.5s"/>

  <!-- Neural Nodes -->
  <g>
    <circle cx="80" cy="60" r="3.5" fill="#58a6ff" class="node n1"/>
    <circle cx="200" cy="90" r="4" fill="#58a6ff" class="node n2"/>
    <circle cx="330" cy="50" r="3" fill="#1f6feb" class="node n3"/>
    <circle cx="310" cy="140" r="3.5" fill="#58a6ff" class="node n4"/>
    <circle cx="120" cy="150" r="2.5" fill="#1f6feb" class="node n5"/>
    <circle cx="450" cy="100" r="4.5" fill="#58a6ff" class="node n6"/>
    <circle cx="580" cy="60" r="3" fill="#1f6feb" class="node n1" style="animation-delay:.7s"/>
    <circle cx="600" cy="150" r="3.5" fill="#58a6ff" class="node n3" style="animation-delay:1.2s"/>
    <circle cx="700" cy="80" r="4" fill="#58a6ff" class="node n2" style="animation-delay:.4s"/>
    <circle cx="820" cy="55" r="3" fill="#1f6feb" class="node n5" style="animation-delay:1.8s"/>
    <circle cx="830" cy="130" r="3" fill="#58a6ff" class="node n4" style="animation-delay:.9s"/>
    <!-- Extra small nodes -->
    <circle cx="45" cy="95" r="1.5" fill="#8957e5" class="node n6" style="animation-delay:2s"/>
    <circle cx="155" cy="35" r="1.5" fill="#8957e5" class="node n3" style="animation-delay:1s"/>
    <circle cx="380" cy="170" r="1.5" fill="#8957e5" class="node n1" style="animation-delay:2.5s"/>
    <circle cx="520" cy="30" r="1.5" fill="#8957e5" class="node n5" style="animation-delay:.5s"/>
    <circle cx="660" cy="165" r="1.5" fill="#8957e5" class="node n2" style="animation-delay:1.7s"/>
    <circle cx="870" cy="90" r="1.5" fill="#8957e5" class="node n4" style="animation-delay:3s"/>
    <circle cx="260" cy="25" r="1" fill="#3fb950" class="node n6" style="animation-delay:1.3s"/>
    <circle cx="750" cy="160" r="1" fill="#3fb950" class="node n1" style="animation-delay:2.2s"/>
  </g>

  <!-- Floating Particles -->
  <g>
    <circle cx="150" cy="70" r="1" class="particle p1"/>
    <circle cx="350" cy="120" r="1.2" class="particle p2"/>
    <circle cx="500" cy="50" r=".8" class="particle p3"/>
    <circle cx="650" cy="130" r="1" class="particle p4"/>
    <circle cx="250" cy="160" r=".8" class="particle p5"/>
    <circle cx="750" cy="40" r="1" class="particle p6"/>
    <circle cx="100" cy="120" r=".7" class="particle p7"/>
    <circle cx="800" cy="100" r=".9" class="particle p8"/>
    <!-- Extra particles with different colors -->
    <circle cx="400" cy="40" r=".6" class="particle p1" style="fill:#8957e5"/>
    <circle cx="550" cy="160" r=".7" class="particle p3" style="fill:#8957e5"/>
    <circle cx="180" cy="130" r=".5" class="particle p6" style="fill:#3fb950"/>
    <circle cx="680" cy="50" r=".6" class="particle p8" style="fill:#3fb950"/>
  </g>

  <!-- Title Text -->
  <g class="title-glow">
    <text x="450" y="88" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="6">JACKSON KALLE</text>
  </g>
  <text x="450" y="118" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" fill="#8b949e" letter-spacing="3" font-weight="400">SYSTEMS ARCHITECT  ·  SECURITY &amp; DIGITAL FORENSICS ENGINEER</text>

  <!-- Bottom accent line -->
  <line x1="300" y1="145" x2="600" y2="145" stroke="url(#line-grad)" stroke-width="1"/>
</svg>
